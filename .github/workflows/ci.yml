name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # macos-14 was retired on 2026-11-02; a job that asks for it is cancelled
    # before it starts ("the configuration 'macos-14-arm64-us-default' is not
    # supported"), which reads as someone cancelling the run rather than as a
    # broken workflow. Pinned rather than macos-latest so a new image lands
    # here as a deliberate change, not as an overnight surprise -- the cost of
    # that being exactly this: the pin has to be moved when an image retires.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      # Build both slices the same way build.sh does, so a break in either
      # architecture surfaces here rather than on someone's Intel Mac.
      - name: Build (arm64)
        run: swift build -c release --triple arm64-apple-macosx14.0

      - name: Build (x86_64)
        run: swift build -c release --triple x86_64-apple-macosx14.0

      # CI has no ~/.claude/projects, so only the corpus-independent
      # assertions can run. --pure makes that explicit instead of relying
      # on auto-detection.
      - name: Self-test (pure)
        run: ./.build/arm64-apple-macosx/release/ClaudeSessionSearch --selftest --pure

      - name: Assemble the .app
        run: ./build.sh

      - name: Verify universal binary
        run: |
          BIN="dist/Claude Session Search.app/Contents/MacOS/ClaudeSessionSearch"
          lipo -info "$BIN"
          lipo -info "$BIN" | grep -q 'x86_64 arm64'
